:root{

  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1300px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 130px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,5vw,3rem);line-height:1.05;margin:4px 0 6px;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:70ch}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:18px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .pill{background:var(--sunk);border-radius:999px;padding:1px 8px;font-size:.78rem;margin-left:6px;font-variant-numeric:tabular-nums}
.layout{display:grid;gap:28px;margin-top:8px}
@media (min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 390px}.wrap{padding-bottom:48px}}
main{min-width:0}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cat{margin-top:22px}
.cat-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cat-head h2{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:-.01em}
.cat-count{color:var(--muted);font-size:.85rem}
.cat-head .btn{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s;min-width:0}
.card.in{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.media{aspect-ratio:16/10;position:relative;background:var(--sunk);max-width:100%}
.media svg,.media img{width:100%;height:100%;display:block;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;background:var(--surface);color:var(--ink);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.incart{position:absolute;top:10px;right:10px;background:var(--accent);color:var(--accent-ink);font-size:.75rem;font-weight:700;padding:4px 9px;border-radius:999px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0;line-height:1.2}
.desc{margin:0;color:var(--muted);font-size:.92rem}
details summary{cursor:pointer;font-size:.85rem;font-weight:600;color:var(--accent);list-style:none;padding-block:2px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ "}
details[open] summary::before{content:"− "}
.incl{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:3px;font-size:.88rem}
.incl li{padding-left:16px;position:relative}
.incl li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--accent);opacity:.7}
.foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:10px}
.price{display:flex;flex-direction:column}
.amt{font-family:var(--f-display);font-weight:800;font-size:1.4rem;color:var(--price);font-variant-numeric:tabular-nums;line-height:1.1}
.unit{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.btn{border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--sunk);line-height:1.2}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn.danger{color:var(--danger);border-color:var(--line);background:transparent}
.btn.danger.armed{background:var(--danger);color:var(--bg);border-color:var(--danger)}
.edit-btn{align-self:flex-start;margin-top:6px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--sunk);width:34px;height:34px;cursor:pointer;font-size:1.1rem;font-weight:700}
.stepper span{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-width:0}
@media (min-width:980px){.cart{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;align-self:start}.cart .close{display:none}}
.cart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.cart-head h2{font-family:var(--f-display);font-size:1.35rem;margin:0}
.count{font-size:.85rem;color:var(--muted)}
.note{margin:12px 18px 0;padding:9px 12px;background:var(--accent-soft);border-radius:10px;font-size:.85rem}
.lines{padding:6px 18px;display:grid}
.line{padding-block:12px;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.line:last-child{border-bottom:0}
.line-name{font-weight:700;min-width:0}
.line-meta{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.line-sum{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.line .incl{grid-column:1/-1;font-size:.82rem;color:var(--muted);margin-top:2px}
.line .stepper button{width:28px;height:28px;font-size:1rem}
.line .stepper span{min-width:26px;font-size:.9rem}
.empty{padding:22px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.1rem;margin-bottom:4px}
.fields{padding:14px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
.f input,.f select,.f textarea,.linkbox input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-size:.95rem;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);min-width:0}
.f textarea{min-height:100px;resize:vertical}
.totals{padding:14px 18px;border-top:1px solid var(--line);display:grid;gap:6px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;gap:10px}
.row.muted{color:var(--muted);font-size:.88rem}
.row.grand{font-family:var(--f-display);font-weight:800;font-size:1.5rem;padding-top:8px;border-top:2px solid var(--line);margin-top:4px}
.row.grand span:last-child{color:var(--price)}
.cart-actions{padding:0 18px 18px;display:flex;gap:8px;flex-wrap:wrap}
.cart-actions .primary{flex:1}
.bar{display:none}
.scrim{display:none}
@media (max-width:979px){
  .cart{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s ease;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .cart.open{transform:none}
  .scrim{position:fixed;inset:0;background:var(--scrim);z-index:25}

.offer h3{font-family:var(--f-display);font-size:1.2rem;margin:0;line-height:1.2}
.meta{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

.status.on{background:var(--accent-soft);color:var(--accent)}

.offer-actions{display:flex;gap:8px;flex-wrap:wrap}
.emptybox{margin-top:18px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.emptybox strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.2rem;margin-bottom:6px}

function imgSrc(k){if(!k)return null;if(String(k).startsWith('data:'))return k;return imgCache[k]||null}
function media(i){const src=imgSrc(i.img);return src?`<img src="${src}" alt="${esc(i.name)}">`:art(i.motif,i.hue)}
async function loadImages(items){
  if(!db)return;
  const keys=[...new Set(items.map(i=>i.img).filter(k=>k&&!String(k).startsWith('data:')&&!(k in imgCache)))];
  if(!keys.length)return;
  await Promise.all(keys.map(k=>db.collection('images').doc(k).get().then(d=>{imgCache[k]=d.exists?d.data().data:null}).catch(()=>{imgCache[k]=null})));
  if($('catalog')&&ctx)renderCatalog();
}

/* ---------- Berechnung ---------- */
function calc(items,selItems,km,settings){
  let sub=0;const lines=[];
  for(const [id,q] of Object.entries(selItems||{})){
    const it=items.find(x=>x.id===id);
    if(!it||q<=0)continue;
    lines.push({it,q,sum:it.price*q});sub+=it.price*q;
  }
  lines.sort((a,b)=>items.indexOf(a.it)-items.indexOf(b.it));
  km=Math.max(0,+km||0);const rate=+settings.kmRate||0,anf=km*rate,total=sub+anf;
  const mw=total-total/(1+(+settings.mwst||0)/100);
  return {lines,sub,km,rate,anf,total,mw,net:total-mw,count:lines.reduce((a,l)=>a+l.q,0)};
}
const kmOf=c=>c.mode==='admin'?c.sel.km:c.offer.km;
const totals=()=>calc(ctx.items,ctx.sel.items,kmOf(ctx),ctx.settings);

function route(){
  closeModal();setCartOpen(false);
  const h=decodeURIComponent(location.hash.slice(1));
  let next;
  if(!configured){next='setup';renderSetup()}
  else if(h.startsWith('a-')){next='offer:'+h;showOffer(h)}
  else if(h==='admin'){
    if(!authReady){next='loading';renderLoading()}
    else if(!user){next='login';renderLogin()}
    else if(adminError){next='error';renderAdminError()}
    else if(!catalog){next='loading';renderLoading()}
    else{next='admin';renderAdmin()}
  }
  else{next='landing';renderLanding()}
  if(next!==view&&view)window.scrollTo(0,0);
  view=next;
}

/* ---------- Firebase-Daten ---------- */
function permMsg(e){return e&&e.code==='permission-denied'?'Firebase verweigert den Zugriff. Prüfe, ob deine E-Mail-Adresse in den Firestore-Regeln eingetragen ist.':'Verbindung zu Firebase fehlgeschlagen ('+(e&&e.code||'unbekannt')+').'}
function startAdmin(){
  stopAdmin();
  unsubCatalog=db.collection('catalog').doc('main').onSnapshot(async snap=>{
    if(!snap.exists){try{await db.collection('catalog').doc('main').set(clone(DEFAULT))}catch(e){adminError=permMsg(e);route()}return}
    catalog=snap.data();catalog.items=catalog.items||[];catalog.categories=catalog.categories||[];
    adminError='';refresh();loadImages(catalog.items.concat(...offers.map(o=>o.items||[])));
  },e=>{adminError=permMsg(e);route()});
  unsubOffers=db.collection('offers').orderBy('created','desc').onSnapshot(snap=>{
    offers=snap.docs.map(d=>d.data());refresh();
  },e=>{adminError=permMsg(e);route()});
}
function stopAdmin(){unsubCatalog&&unsubCatalog();unsubOffers&&unsubOffers();unsubCatalog=unsubOffers=null;catalog=null;offers=[]}
function refresh(){
  const h=location.hash.slice(1);
  if(h!=='admin')return;
  if($('modalRoot').innerHTML){pendingRender=true;return}
  if(view==='admin')renderAdmin();else route();
}
async function showOffer(id){
  let o=offerCache[id];
  if(!o){
    renderLoading();
    try{const d=await db.collection('offers').doc(id).get();o=d.exists?d.data():null}catch(e){o=null}
    if(o)offerCache[id]=o;
    if(decodeURIComponent(location.hash.slice(1))!==id)return;
  }
  if(!o){renderMissing();return}
  renderOffer(o);loadImages(o.items);
}

function offerText(){
  const o=ctx.offer,T=totals(),L=[];

  if(ctx.sel.datum){const d=new Date(ctx.sel.datum+'T12:00');L.push(`Datum: ${d.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}`)}

function readImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,900/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function setCartOpen(o){const c=$('cart'),s=$('scrim');if(c)c.classList.toggle('open',o);if(s)s.classList.toggle('show',o)}


/* ---------- Datensicherung ---------- */
function lastBackupText(){const d=load('last-backup');return d?'Letzte Sicherung auf diesem Gerät: '+fmtDate(d):'Auf diesem Gerät wurde noch keine Sicherung heruntergeladen.'}
async function backup(){
  toast('Sicherung wird erstellt …',true);
  try{
    const [cat,off,img]=await Promise.all([db.collection('catalog').doc('main').get(),db.collection('offers').get(),db.collection('images').get()]);
    const data={format:'preisliste-sicherung',version:1,created:new Date().toISOString(),
      catalog:cat.exists?cat.data():null,
      offers:off.docs.map(d=>d.data()),
      images:Object.fromEntries(img.docs.map(d=>[d.id,d.data().data]))};
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='preisliste-sicherung-'+isoToday()+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    save('last-backup',isoToday());const i=$('backupInfo');if(i)i.textContent=lastBackupText();
    toast(`Sicherung gespeichert: ${data.catalog?data.catalog.items.length:0} Leistungen, ${data.offers.length} Angebote, ${Object.keys(data.images).length} Fotos`);
  }catch(e){toast(permMsg(e))}
}
let pendingRestore=null;
async function restoreBackup(file){
  let data;
  try{data=JSON.parse(await file.text())}catch(e){toast('Die Datei ist keine gültige Sicherung.');return}
  if(!data||data.format!=='preisliste-sicherung'||!data.catalog){toast('Die Datei ist keine Sicherung dieser Preisliste.');return}
  pendingRestore=data;
  openModal(`<h2>Sicherung einspielen</h2>
    <p class="hint">Sicherung vom ${fmtDate(data.created)}: ${data.catalog.items.length} Leistungen, ${(data.offers||[]).length} Angebote, ${Object.keys(data.images||{}).length} Fotos.</p>
    <p class="hint">Die aktuelle Preisliste wird durch die aus der Sicherung ersetzt. Angebote und Fotos, die es schon gibt, bleiben unverändert. Fehlende werden wiederhergestellt, ihre Links funktionieren dann wieder.</p>
    <div class="dialog-actions"><span class="spacer"></span><button class="btn ghost" data-action="close-modal">Abbrechen</button><button class="btn primary" data-action="do-restore">Einspielen</button></div>`);
}
async function doRestore(){
  const data=pendingRestore;if(!data||saving)return;
  saving=true;
  try{
    const imgs=Object.entries(data.images||{}),offs=data.offers||[];
    let n=0;const total=imgs.length+offs.length;
    const step=()=>toast(`Wird eingespielt … ${n} von ${total}`,true);
    for(const [k,v] of imgs){const ref=db.collection('images').doc(k);if(!(await ref.get()).exists)await ref.set({data:v});imgCache[k]=v;n++;step()}
    for(const o of offs){const ref=db.collection('offers').doc(o.id);if(!(await ref.get()).exists)await ref.set(o);n++;step()}
    await db.collection('catalog').doc('main').set(data.catalog);
    saving=false;pendingRestore=null;closeModal();toast('Sicherung eingespielt');
  }catch(e){saving=false;toast(permMsg(e))}
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  const a=b.dataset.action,id=b.dataset.id;
  if(a==='modal-bg'&&e.target!==b)return;
  switch(a){
    case 'add':setQty(id,1);break;
    case 'inc':setQty(id,(ctx.sel.items[id]||0)+1);break;
    case 'dec':setQty(id,(ctx.sel.items[id]||0)-1);break;
    case 'filter':filter=b.dataset.cat;renderFilters();renderCatalog();break;
    case 'tab':tab=b.dataset.tab;renderAdmin();window.scrollTo(0,0);break;
    case 'edit':openEditor(id);break;
    case 'new':openEditor(null,b.dataset.cat);break;
    case 'settings':openSettings();break;
    case 'save-item':saveItem();break;
    case 'save-settings':saveSettings();break;
    case 'backup':backup();break;
    case 'do-restore':doRestore();break;
    case 'remove-img':{draftImg=null;const it=catalog.items.find(x=>x.id===editingId);$('eThumb').innerHTML=art($('eMotif').value,it?it.hue:200);b.remove();break}
    case 'delete-item':arm(b,'Wirklich löschen?',()=>{const d=editingId;delete ctx.sel.items[d];ctx.save();saveCatalog(c=>{c.items=c.items.filter(x=>x.id!==d)},'Gelöscht')});break;
    case 'close-modal':case 'modal-bg':closeModal();break;
    case 'open-cart':setCartOpen(true);break;
    case 'close-cart':setCartOpen(false);break;
    case 'clear':arm(b,'Wirklich leeren?',()=>{save('admin-sel',{items:{},km:''});templateFrom=null;renderAdmin()});break;
    case 'new-offer':openCreate();break;
    case 'create-offer':createOffer();break;
    case 'copy-link':{const inp=$('lnk-'+id);if(inp)copyFrom(inp);break}
    case 'view-offer':$('modalRoot').innerHTML='';location.hash=id;break;
    case 'back-admin':location.hash='admin';break;
    case 'logout':auth.signOut();break;
    case 'template':{const o=offers.find(x=>x.id===id);if(!o)break;
      const items={};let missing=0;Object.entries(o.selection||{}).forEach(([k,q])=>{if(catalog.items.some(i=>i.id===k))items[k]=q;else missing++});
      save('admin-sel',{items,km:o.km||''});templateFrom={title:o.title,customer:o.customer,eventDate:o.eventDate,note:o.note};
      tab='preise';renderAdmin();window.scrollTo(0,0);
      toast(missing?`Auswahl übernommen, ${missing} Leistung(en) gibt es nicht mehr.`:'Auswahl mit aktuellen Preisen übernommen.');break}
    case 'withdraw':arm(b,'Link wirklich ungültig machen?',async()=>{try{await db.collection('offers').doc(id).delete();delete offerCache[id];toast('Angebot zurückgezogen')}catch(err){toast(permMsg(err))}});break;
    case 'copy':if(!totals().lines.length){toast('Es ist noch nichts ausgewählt.');break}openCopy();break;
    case 'do-copy':copyFrom($('copyText'));break;
    case 'reset-sel':{const o=ctx.offer;try{localStorage.removeItem('offer-'+o.id)}catch(err){}renderOffer(o);toast('Auswahl zurückgesetzt');break}
  }
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details[data-id]'))openDetails.set(d.dataset.id,d.open)},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('modalRoot').innerHTML)closeModal();else setCartOpen(false)}});
window.addEventListener('hashchange',()=>{document.title='Preisliste';route()});

/* ---------- Start ---------- */
route();
if(configured){
  auth.onAuthStateChanged(u=>{
    user=u;authReady=true;adminError='';
    if(u)startAdmin();else stopAdmin();
    if(location.hash.slice(1)==='admin'||!u)route();
  });
}

</script>
</body>
</html>
